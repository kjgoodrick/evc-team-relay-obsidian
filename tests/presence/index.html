<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presence picture checks</title><link rel="stylesheet" href="/production.css"><style>
:root{color-scheme:light dark;--background-primary:light-dark(#fff,#202020);--background-secondary:light-dark(#eee,#303030);--background-modifier-border:#777;--text-normal:light-dark(#222,#eee);--text-muted:#888;--shadow-s:0 2px 8px #0004}body{font:16px system-ui;margin:20px;background:var(--background-primary);color:var(--text-normal)}.title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:30px 0}h2{font-size:22px;margin:0}button{font:inherit;min-height:44px;margin:4px;padding:8px}pre{white-space:pre-wrap;font-size:13px}#mount{flex-shrink:0}#fixture-note{min-height:100px;padding:16px;border:1px solid #888;border-radius:8px}</style></head><body>
<h2>Production presence components</h2><p id="viewport"></p><div class="title"><h2>Shared note</h2><div id="mount"></div></div><p id="fixture-note">Tap the pictures beside the title to open the active-user list. The green portrait is a synthetic image. Users without a picture keep their initial.</p><button id="checks">Run checks</button><button id="refresh">Change picture</button><button id="remove">Remove picture</button><pre id="results">Ready</pre><pre id="errors"></pre><script type="module" src="/bundle.js"></script></body></html>
