<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Relay updater checks</title><link rel="stylesheet" href="/production.css"><style>
:root{color-scheme:light dark;--background-primary:#fff;--background-modifier-border:#bbb;--text-error:#b11;--text-normal:#222}body{font:16px system-ui;margin:16px;color:var(--text-normal);background:var(--background-primary)}button,select{font:inherit;min-height:44px;padding:8px;max-width:100%}a{color:#8263db}h1{font-size:20px}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}#tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.evc-plugin-updates{margin-bottom:8px!important}@media(prefers-color-scheme:dark){:root{--background-primary:#202024;--background-modifier-border:#666;--text-error:#ff8d8d;--text-normal:#eee}}@media(max-height:450px){h1{margin:4px 0}body{margin:8px}#intro{display:none}}
